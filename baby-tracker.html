  var m=ui.month,ro=readOnly(),dis=ro?' disabled':'';
  var tally={a:{d:0,o:0},b:{d:0,o:0},'':{d:0,o:0}};
  allD().forEach(function(d){var o=ownerFor(m,d.id);var c=counts(d,m);tally[o].d++;tally[o].o+=c.total-c.done});
  var h='';
  h+='<header><h1>Who’s holding what</h1><p class="lede">Every domain has one owner, who notices what’s needed, researches it, plans it, and remembers it. The other parent still pitches in, but the owner carries the thinking.</p>';
  h+='<div class="names"><label class="name"><i class="dot-a"></i><input data-act="name" data-o="a" aria-label="First parent’s name" value="'+esc(state.names.a)+'"'+dis+'></label>';
  h+='<label class="name"><i class="dot-b"></i><input data-act="name" data-o="b" aria-label="Second parent’s name" value="'+esc(state.names.b)+'"'+dis+'></label></div>';
  h+='<section class="balance" aria-label="Load split for '+m+' months"><div class="bar" role="img" aria-label="'+esc(nm('a'))+' owns '+tally.a.d+' domains, '+esc(nm('b'))+' owns '+tally.b.d+', '+tally[''].d+' unassigned">';
  if(tally.a.d)h+='<span class="seg-a" style="flex-grow:'+tally.a.d+'"></span>';
  if(tally.b.d)h+='<span class="seg-b" style="flex-grow:'+tally.b.d+'"></span>';
  if(tally[''].d)h+='<span class="seg-n" style="flex-grow:'+tally[''].d+'"></span>';
  h+='</div><div class="legend">';
  [['a','lg-a'],['b','lg-b'],['','lg-n']].forEach(function(p){var t=tally[p[0]];h+='<div class="'+p[1]+'"><div class="who">'+esc(nm(p[0]))+'</div><b>'+t.d+'</b><small>'+(t.d===1?'domain':'domains')+', '+t.o+' open '+(t.o===1?'item':'items')+'</small></div>'});
  h+='</div></section></header>';
  h+='<div class="stick"><div class="months" role="group" aria-label="Baby’s age">';
  MONTHS.forEach(function(x){h+='<button data-act="month" data-m="'+x+'" aria-pressed="'+(x===m)+'">'+x+' months</button>'});
  h+='</div><div class="filters" role="group" aria-label="Show domains owned by">';
  [['all','Everyone',''],['a',nm('a'),'dot-a'],['b',nm('b'),'dot-b'],['none','Unassigned','dot-n']].forEach(function(f){h+='<button data-act="filter" data-f="'+f[0]+'" aria-pressed="'+(ui.filter===f[0])+'">'+(f[2]?'<i class="'+f[2]+'"></i>':'')+esc(f[1])+'</button>'});
  h+='</div>';
  if(ro)h+='<div class="banner">This view is read-only. Ask whoever shared it for edit access to make changes.</div>';
  else if(mode==='local')h+='<div class="banner">Changes save in this browser only. Open the tracker from its shared link to save for both of you.</div>';
  h+='<div class="status" aria-live="polite">'+esc(statusText)+'</div></div>';
  var shown=0;
  GROUPS.forEach(function(g){
    var ds=allD().filter(function(d){if(d.g!==g.id)return false;var o=ownerFor(m,d.id);return ui.filter==='all'||(ui.filter==='none'?o==='':o===ui.filter)});
    if(!ds.length)return;
    h+='<section class="group"><h2>'+esc(g.name)+'</h2>';
    ds.forEach(function(d){shown++;h+=domainHtml(d,m,ro)});
    h+='</section>';
  });
  if(!shown)h+='<p class="empty">No domains match this filter for '+m+' months. Pick another filter or assign owners.</p>';
  if(!ro){
    h+='<section class="newdom"><h2>Add a domain</h2><p class="hint">For anything that keeps coming up and doesn’t fit an existing domain.</p><div class="newrow"><input data-act="newdomain" placeholder="Domain name, like Pets" aria-label="New domain name" maxlength="60"><select data-act="newgroup" aria-label="Section">';
    GROUPS.forEach(function(g){h+='<option value="'+g.id+'">'+esc(g.name)+'</option>'});
    h+='</select><button data-act="adddomain">Add domain</button></div></section>';
  }
  h+='<p class="foot">Owners carry forward: setting one at 10 months applies to 11 and 12 too, unless you change it there. Rebalance when a month looks lopsided.</p>';
  document.getElementById('app').innerHTML=h;
}

function domainHtml(d,m,ro){
  var o=ownerFor(m,d.id),oc=o||'n',c=counts(d,m),open=!!ui.open[d.id],dis=ro?' disabled':'';
  var pct=c.total?Math.round(c.done/c.total*100):0;
  var h='<article class="domain o-'+oc+'"><button class="dhead" data-act="toggle" data-d="'+d.id+'" aria-expanded="'+open+'">';
  h+='<span class="dname">'+esc(d.name)+'</span><span class="pill '+oc+'">'+esc(nm(o))+'</span>';
  h+='<span class="meta"><span class="mini"><span style="width:'+pct+'%"></span></span>'+c.done+' of '+c.total+' done</span></button>';
  if(open){
    h+='<div class="dbody"><div class="sub">Owner at '+m+' months</div><div class="pick" role="group" aria-label="Owner">';
    [['a','a'],['b','b'],['','n']].forEach(function(p){h+='<button class="'+p[1]+'" data-act="owner" data-d="'+d.id+'" data-o="'+p[0]+'" aria-pressed="'+(o===p[0])+'"'+dis+'>'+esc(nm(p[0]))+'</button>'});
    h+='</div><p class="hint">Later months follow this choice unless changed there.</p>';
    h+='<div class="sub">What owning it means</div><dl class="own">';
    if(d.custom){var ph=['What to watch for','What to look into','What to plan or schedule','What to keep track of'];d.own.forEach(function(t,i){h+='<div><dt>'+STAGES[i]+'</dt><dd><input class="ownin" data-act="ownedit" data-d="'+d.id+'" data-i="'+i+'" value="'+esc(t)+'" placeholder="'+ph[i]+'" aria-label="'+STAGES[i]+' for '+esc(d.name)+'"'+dis+'></dd></div>'})}
    else d.own.forEach(function(t,i){h+='<div><dt>'+STAGES[i]+'</dt><dd>'+esc(t)+'</dd></div>'});
    h+='</dl><div class="sub">This month</div><ul class="checks">';
    items(d,m).forEach(function(it){h+=checkHtml(it,m,d,ro)});
    h+='</ul><div class="add"><input data-act="addinput" data-d="'+d.id+'" placeholder="Add something for this month" aria-label="New item for '+esc(d.name)+'"'+dis+'><button data-act="add" data-d="'+d.id+'"'+dis+'>Add</button></div>';
    var ev=every(d);
    if(ev.length){h+='<div class="sub">Every month</div><ul class="checks">';ev.forEach(function(it){h+=checkHtml(it,m,d,ro)});h+='</ul>'}
    h+='<div class="sub">Notes</div><textarea class="notes" data-act="notes" data-d="'+d.id+'" rows="2" placeholder="Decisions, contacts, things to remember" aria-label="Notes for '+esc(d.name)+'"'+dis+'>'+esc(state.notes[d.id]||'')+'</textarea>';
    if(d.custom&&!ro)h+='<button class="rmdom" data-act="rmdomain" data-d="'+d.id+'">Delete this domain</button>';
    h+='</div>';
  }
  return h+'</article>';
}
function checkHtml(it,m,d,ro){
  var dis=ro?' disabled':'';
  var h='<li><label><input type="checkbox" data-act="check" data-k="'+esc(it.k)+'"'+(isDone(m,it.k)?' checked':'')+dis+'><span>'+esc(it.t)+'</span></label>';
  if(it.kind==='custom'&&!ro)h+='<button class="rm" data-act="rm" data-d="'+d.id+'" data-c="'+esc(it.cid)+'" aria-label="Remove '+esc(it.t)+'">Remove</button>';
  return h+'</li>';
}

function saveUi(){try{sessionStorage.setItem('bdt-ui',JSON.stringify({month:ui.month,open:ui.open,filter:ui.filter}))}catch(e){}}
function setStatus(t){statusText=t;var s=document.querySelector('.status');if(s)s.textContent=t}
function change(){
  if(readOnly())return;
  dirty=true;setStatus('Unsaved changes');
  clearTimeout(timer);
  if(mode==='pending')return;
  timer=setTimeout(save,1800);
}
function buildHtml(){
  var css=document.getElementById('css').textContent;
  var js=document.getElementById('app-js').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Who’s holding what: months 10 to 12<\/title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">\n<style id="css">'+css+'<\/style>\n<\/head>\n<body>\n<div id="app" class="wrap"><h1>Who’s holding what<\/h1><p class="lede">Loading the tracker…<\/p><\/div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app-js">'+js+'<\/script>\n<\/body>\n<\/html>\n';
}
function save(){
  if(!dirty||readOnly())return;
  if(mode==='local'){
    try{localStorage.setItem(LKEY,JSON.stringify(state));dirty=false;setStatus('Saved in this browser')}catch(e){setStatus('Couldn’t save in this browser')}
    return;
  }
  if(mode!=='shared'||!api)return;
  saveUi();setStatus('Saving…');
  api.publish(buildHtml()).then(function(){dirty=false;setStatus('Saved')}).catch(function(err){
    var code=err&&err.code;
    if(code==='conflict'){setStatus('Someone else just saved. Loading their version…');return}
    if(['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].indexOf(code)>-1){mode='readonly';dirty=false;render();return}
    if(code==='rate_limited'){setStatus('Saving too often. Retrying shortly…');clearTimeout(timer);timer=setTimeout(save,10000);return}
    if(code==='upstream_error'&&!retried){retried=true;clearTimeout(timer);timer=setTimeout(save,1000+Math.random()*1500);return}
    setStatus('Couldn’t save. Make another change to try again.');
  });
}

var app=document.getElementById('app');
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,d=b.dataset.d;
  if(a==='toggle'){ui.open[d]=!ui.open[d];saveUi();render();return}
  if(a==='month'){ui.month=+b.dataset.m;saveUi();render();return}
  if(a==='filter'){ui.filter=b.dataset.f;saveUi();render();return}
  if(readOnly())return;
  if(a==='owner'){var m=ui.month;state.owners[m]=state.owners[m]||{};state.owners[m][d]=b.dataset.o;render();change();return}
  if(a==='add'){addItem(d);return}
  if(a==='adddomain'){addDomain();return}
  if(a==='rmdomain'){var dd=state.domains.filter(function(c){return c.id===d})[0];if(!dd||!confirm('Delete “'+dd.name+'” and its items and notes?'))return;state.domains=state.domains.filter(function(c){return c.id!==d});delete state.notes[d];MONTHS.forEach(function(x){if(state.owners[x])delete state.owners[x][d];if(state.custom[x])delete state.custom[x][d]});delete ui.open[d];saveUi();render();change();return}
  if(a==='rm'){var lst=(state.custom[ui.month]||{})[d]||[];state.custom[ui.month][d]=lst.filter(function(c){return c.id!==b.dataset.c});render();change();return}
});
app.addEventListener('change',function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;if(!a||readOnly())return;
  if(a==='check'){var m=ui.month;state.checked[m]=state.checked[m]||{};if(t.checked)state.checked[m][t.dataset.k]=true;else delete state.checked[m][t.dataset.k];render();change()}
  else if(a==='notes'){state.notes[t.dataset.d]=t.value;change()}
  else if(a==='ownedit'){var cd=state.domains.filter(function(c){return c.id===t.dataset.d})[0];if(cd){cd.own=cd.own||['','','',''];cd.own[+t.dataset.i]=t.value.slice(0,200);change()}}
  else if(a==='name'){state.names[t.dataset.o]=t.value.trim()||(t.dataset.o==='a'?'Parent A':'Parent B');render();change()}
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.act==='addinput'){e.preventDefault();addItem(e.target.dataset.d)}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.act==='newdomain'){e.preventDefault();addDomain()}
});
function addDomain(){
  if(readOnly())return;
  var inp=app.querySelector('input[data-act="newdomain"]'),sel=app.querySelector('select[data-act="newgroup"]');if(!inp)return;
  var v=inp.value.trim().slice(0,60);if(!v)return;
  var id='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  state.domains.push({id:id,g:sel?sel.value:'logistics',name:v,own:['','','','']});
  ui.open[id]=true;if(ui.filter!=='all'&&ui.filter!=='none')ui.filter='all';saveUi();render();change();
  var art=app.querySelector('button[data-d="'+id+'"].dhead');if(art)art.scrollIntoView({block:'center'});
}
function addItem(d){
  var inp=app.querySelector('input[data-act="addinput"][data-d="'+d+'"]');if(!inp)return;
  var v=inp.value.trim();if(!v)return;
  var m=ui.month;state.custom[m]=state.custom[m]||{};state.custom[m][d]=state.custom[m][d]||[];
  state.custom[m][d].push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:v.slice(0,200)});
  render();change();
  var ni=app.querySelector('input[data-act="addinput"][data-d="'+d+'"]');if(ni)ni.focus();
}

render();
function goLocal(){
  mode='local';
  try{var ls=localStorage.getItem(LKEY);if(ls){var p=JSON.parse(ls);if(p&&p.v)state=Object.assign(state,p)}}catch(e){}
  render();if(dirty)save();
}
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(ns){
    if(ns&&typeof ns.publish==='function'){api=ns;mode='shared';render();if(dirty)save()}
    else goLocal();
  }).catch(goLocal);
}else goLocal();
})();
</script>
</body>
</html>
